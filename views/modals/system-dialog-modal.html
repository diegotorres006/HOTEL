<!-- COMPONENTE MODAL REUTILIZABLE: Avisos y Notificaciones del Sistema (views/modals/system-dialog-modal.html) -->
<div id="modal-sistema-dialogo" class="fixed inset-0 z-[120] bg-slate-950/80 backdrop-blur-xs hidden flex items-center justify-center p-4">
  <div class="bg-white border border-slate-300 w-full max-w-md rounded-xl shadow-2xl overflow-hidden text-xs modal-animate-in">
    <div class="bg-slate-900 px-5 py-4 flex items-center justify-between border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div id="sysdlg-icon-wrap" class="w-9 h-9 rounded-lg bg-blue-950 border border-blue-700 flex items-center justify-center text-sky-300 shrink-0"></div>
        <div>
          <h3 id="sysdlg-titulo" class="font-bold text-white text-sm uppercase tracking-wide">Notificación del Sistema</h3>
          <p id="sysdlg-subtitulo" class="text-[11px] text-slate-400">Hotel Norte · Gestión Administrativa</p>
        </div>
      </div>
      <button onclick="UIModal.cerrarAviso()" class="text-slate-400 hover:text-white p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-5 space-y-4">
      <p id="sysdlg-mensaje" class="text-slate-800 text-xs leading-relaxed whitespace-pre-line"></p>
      <div id="sysdlg-detalles" class="hidden bg-slate-50 border border-slate-200 rounded-lg p-3.5 space-y-1"></div>
      <div class="pt-2 flex justify-end gap-2" id="sysdlg-botones">
        <button type="button" id="sysdlg-btn-cancelar" onclick="UIModal.cancelarConfirm()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-lg text-xs transition border border-slate-300">
          Cancelar
        </button>
        <button type="button" id="sysdlg-btn-confirmar" onclick="UIModal.ejecutarConfirmar()" class="bg-blue-700 hover:bg-blue-600 text-white font-semibold px-5 py-2 rounded-lg text-xs transition shadow-xs">
          Entendido
        </button>
      </div>
    </div>
  </div>
</div>
