<!-- COMPONENTE MODAL: Autenticación de Personal y PIN (views/modals/login-modal.html) -->
<div id="pantalla-login" class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4 overflow-y-auto">
  <div class="w-full max-w-md my-auto bg-white border border-slate-200 rounded-xl shadow-2xl overflow-hidden modal-animate-in">

    <div class="bg-slate-900 px-6 py-4 flex items-center justify-between text-white">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-sm tracking-wider">
          HN
        </div>
        <div>
          <h2 class="text-sm font-bold tracking-tight">Autenticación de Personal</h2>
          <p class="text-[11px] text-slate-400">Hotel Norte · Control de Turnos de Recepción</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="reloj-login" class="font-mono text-xs text-slate-300 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">00:00:00</span>
        <button onclick="cerrarModalLoginEmpleado()" class="text-slate-400 hover:text-white p-1 transition" title="Cerrar">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="p-6 space-y-5">
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">1. Seleccione Operador de Turno</label>
          <span class="text-[11px] text-slate-400 font-medium">Nómina Activa</span>
        </div>
        <div id="lista-empleados-login" class="grid grid-cols-1 gap-2"></div>
      </div>

      <div id="seccion-pin" class="hidden space-y-4 pt-4 border-t border-slate-200">
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex items-center justify-between">
          <div>
            <span class="text-[10px] uppercase text-slate-500 font-bold block">Operador Seleccionado</span>
            <strong id="login-nombre-seleccionado" class="text-slate-900 text-sm font-bold"></strong>
          </div>
          <div class="text-right">
            <span class="text-[10px] uppercase text-slate-500 font-bold block">Horario Asignado</span>
            <span id="login-turno-sugerido" class="text-slate-700 text-xs font-semibold"></span>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1 text-center">
            2. Ingrese su Clave PIN (4 dígitos)
          </label>
          <p class="text-[11px] text-slate-500 text-center mb-3">La sesión asociará todos los registros a su nombre</p>

          <div class="flex justify-center gap-3 mb-4" id="pin-dots-display">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
          </div>

          <div class="grid grid-cols-3 gap-2 max-w-[240px] mx-auto">
            <button onclick="pinPresionar('1')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">1</button>
            <button onclick="pinPresionar('2')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">2</button>
            <button onclick="pinPresionar('3')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">3</button>
            <button onclick="pinPresionar('4')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">4</button>
            <button onclick="pinPresionar('5')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">5</button>
            <button onclick="pinPresionar('6')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">6</button>
            <button onclick="pinPresionar('7')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">7</button>
            <button onclick="pinPresionar('8')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">8</button>
            <button onclick="pinPresionar('9')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">9</button>
            <button onclick="pinBorrar()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold py-2.5 rounded-lg border border-slate-200 transition select-none">Borrar</button>
            <button onclick="pinPresionar('0')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-900 font-semibold text-base py-2.5 rounded-lg border border-slate-200 transition select-none">0</button>
            <button onclick="volverSeleccion()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold py-2.5 rounded-lg border border-slate-200 transition select-none">Cambiar</button>
          </div>

          <p id="login-error" class="text-red-400 text-xs text-center mt-3 hidden font-semibold">Clave PIN incorrecta. Verifique e intente nuevamente.</p>
        </div>
      </div>

      <div class="pt-3 border-t border-slate-200 flex items-center justify-between text-xs">
        <span class="text-slate-500">Auditoría administrativa</span>
        <button onclick="abrirModalHistorialTurnos(true)" class="text-sky-400 hover:text-sky-300 font-semibold underline">
          Consultar Historial de Turnos
        </button>
      </div>
    </div>
  </div>
</div>
