<!-- COMPONENTE: Barra de Navegación de Fechas y Franja Contextual (views/layout/date-bar.html) -->
<div id="barra-fechas" class="bg-white border-b border-slate-200 px-5 py-2 flex flex-wrap items-center justify-between gap-3">
  <button onclick="navegarDia(-1)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold transition border border-slate-300">
    <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    Día Anterior
  </button>

  <div class="flex items-center gap-2.5 flex-wrap justify-center">
    <div class="flex items-center gap-2 bg-slate-50 px-3.5 py-1 rounded-lg border border-slate-300">
      <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <input type="date" id="input-fecha-selector" onchange="seleccionarFechaDirecta(this.value)"
        class="bg-transparent text-slate-900 font-semibold text-xs font-mono focus:outline-none cursor-pointer">
      <span id="label-dia-semana" class="text-xs font-medium text-slate-600 ml-1 border-l border-slate-300 pl-2.5"></span>
    </div>
    <button onclick="irAHoy()" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 text-xs font-semibold transition">
      Ir a Hoy
    </button>
    <div id="badge-estado-dia" class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wide flex items-center gap-1.5 bg-emerald-950 text-emerald-300 border border-emerald-700">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      <span id="badge-estado-texto">Operación del Día</span>
    </div>
  </div>

  <button onclick="navegarDia(1)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition">
    Día Siguiente
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<div id="banner-contextual-dia" class="bg-slate-200/70 border-b border-slate-300 px-5 py-1.5 flex flex-wrap items-center justify-between text-xs text-slate-700">
  <div class="flex items-center gap-2">
    <span id="banner-icono" class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
    <span id="banner-texto"><strong>OPERACIÓN DIARIA:</strong> Registro de ingresos, control de cobros y salidas del turno en curso.</span>
  </div>
  <span id="banner-etiqueta" class="text-[11px] bg-white px-2 py-0.5 rounded border border-slate-300 font-medium text-slate-700">En curso</span>
</div>
