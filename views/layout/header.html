<!-- COMPONENTE: Barra Superior Ejecutiva (views/layout/header.html) -->
<header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 px-5 py-2.5 flex flex-wrap items-center justify-between gap-4 shadow-xs">

  <!-- Identidad Corporativa + Operador en Turno -->
  <div class="flex items-center gap-3.5">
    <div class="w-9 h-9 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-white font-bold text-sm tracking-wider select-none">
      HN
    </div>
    <div>
      <div class="flex items-center gap-2.5">
        <h1 class="font-bold text-sm tracking-wide uppercase text-white">Hotel Norte</h1>
        <span class="text-slate-600">|</span>
        <span class="text-[11px] text-slate-400 font-medium">Gestión de Recepción</span>
      </div>
      <div class="text-xs text-slate-300 flex items-center gap-2 flex-wrap mt-0.5">
        <span>Turno: <strong id="hdr-turno" class="text-white font-semibold">Mañana (08:00 – 17:00)</strong></span>
        <span class="text-slate-600">·</span>
        <span>Recepcionista: <strong id="hdr-empleado" class="text-white font-semibold">Wilson Paredes</strong></span>
        <span class="text-slate-400 text-[11px]">(Inicio: <span id="hdr-hora-inicio" class="font-mono text-slate-300">08:00</span>)</span>
        <button onclick="abrirModalLoginEmpleado()" class="ml-1 px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-[11px] font-medium transition flex items-center gap-1" title="Autenticar otro operador con clave PIN">
          <svg class="w-3 h-3 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          Cambiar Operador
        </button>
      </div>
    </div>
  </div>

  <!-- Buscador de Huéspedes Activos -->
  <div class="flex-1 max-w-md mx-2">
    <div class="relative">
      <input type="text" id="buscador-huespedes-hoy" oninput="buscarHuespedActivo(this.value)"
        placeholder="Buscar huésped alojado por nombre, identificación o habitación..."
        class="w-full bg-slate-800/90 border border-slate-700 rounded-lg pl-9 pr-4 py-1.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-slate-400 focus:bg-slate-800 transition">
      <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>
    <div id="resultado-busqueda-activos" class="hidden text-[11px] text-slate-200 mt-1 font-medium pl-1"></div>
  </div>

  <!-- Reloj del Sistema en Tiempo Real -->
  <div class="bg-slate-800/80 border border-slate-700 px-3 py-1 rounded-lg flex items-center gap-2.5 text-xs">
    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <div>
      <span class="text-[9px] uppercase font-semibold text-slate-400 block tracking-wider">Hora del Sistema</span>
      <strong id="reloj-real" class="font-mono text-white text-xs tracking-wider">00:00:00</strong>
    </div>
  </div>

  <!-- Indicadores de Caja y Controles de Turno -->
  <div class="flex items-center gap-3">
    <!-- Estado de Base de Datos y Respaldo -->
    <div id="indicador-estado-bd" class="hidden md:flex items-center gap-1.5 px-2 py-1 rounded bg-slate-800/90 border border-slate-700" title="Motor de Base de Datos Local Resiliente (Persistencia atómica en disco)">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider font-mono">BD Disco Activa</span>
    </div>

    <button onclick="crearRespaldoManualEnDisco()" class="hidden lg:flex bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 font-medium px-2 py-1 rounded text-[11px] transition items-center gap-1" title="Generar copia de seguridad inmediata en disco (data/backups)">
      <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
      Backup
    </button>

    <!-- Cajas Independientes en Vivo: Hospedaje ($200 Base) y Bar ($50 Base) -->
    <div class="hidden xl:flex items-center gap-2 border-l border-slate-800 pl-3">
      <!-- Caja Hospedaje -->
      <div class="bg-slate-800/95 border border-slate-700/80 rounded-lg px-2.5 py-1 text-[11px]" title="Caja Hospedaje: Fondo Fijo $200.00 + Recaudado en Turno. Al cerrar, administradora retira recaudación y quedan $200.00 base.">
        <div class="flex items-center justify-between gap-3">
          <span class="text-slate-400 text-[10px] uppercase font-bold tracking-wider">Caja Hospedaje</span>
          <span id="hdr-caja-hosp-recaudado" class="text-emerald-400 font-mono font-bold">+$0.00</span>
        </div>
        <div class="flex items-center justify-between gap-2 text-[10px] text-slate-300 font-mono mt-0.5">
          <span class="text-slate-400">En Gaveta:</span>
          <strong id="hdr-caja-hosp-total" class="text-white font-bold">$200.00</strong>
        </div>
      </div>

      <!-- Caja Bar -->
      <div class="bg-slate-800/95 border border-slate-700/80 rounded-lg px-2.5 py-1 text-[11px]" title="Caja Bar: Fondo Fijo $50.00 + Recaudado en Turno. Al cerrar, administradora retira recaudación y quedan $50.00 base.">
        <div class="flex items-center justify-between gap-3">
          <span class="text-slate-400 text-[10px] uppercase font-bold tracking-wider">Caja Bar</span>
          <span id="hdr-caja-bar-recaudado" class="text-sky-400 font-mono font-bold">+$0.00</span>
        </div>
        <div class="flex items-center justify-between gap-2 text-[10px] text-slate-300 font-mono mt-0.5">
          <span class="text-slate-400">En Gaveta:</span>
          <strong id="hdr-caja-bar-total" class="text-white font-bold">$50.00</strong>
        </div>
      </div>
    </div>

    <div class="text-right text-xs border-l border-slate-800 pl-3">
      <div class="text-slate-400"><span id="lbl-top-pagado">Recaudado:</span> <strong id="top-pagado" class="text-emerald-400 font-mono font-semibold">$0.00</strong></div>
      <div class="text-slate-400"><span id="lbl-top-debito">Por Cobrar:</span> <strong id="top-debito" class="text-amber-400 font-mono font-semibold">$0.00</strong></div>
    </div>

    <div class="flex items-center gap-1.5">
      <button onclick="abrirModalBooking()" class="bg-[#162a4a] hover:bg-[#1e3863] text-sky-200 border border-sky-800/70 font-semibold px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5" title="Sincronización y reservas de Booking.com">
        <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
        Booking.com
        <span id="badge-booking-pendientes" class="bg-sky-600 text-white text-[10px] font-mono px-1.5 py-0.2 rounded">0</span>
      </button>
      <button onclick="abrirModalD2Fac()" class="bg-[#152c4a] hover:bg-[#1d3b63] text-blue-200 border border-blue-700/70 font-semibold px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5" title="Facturación Electrónica D2Fac (0301752861001)">
        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        D2Fac SRI
        <span class="w-2 h-2 rounded-full bg-emerald-400" title="Conectado a D2Fac: 0301752861001"></span>
      </button>
      <button onclick="abrirModalArqueo()" class="bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-medium px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        Arqueo
      </button>
      <button onclick="abrirModalBitacora()" class="bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-medium px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Bitácora
      </button>
      <button onclick="abrirModalHistorialTurnos(false)" class="bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 font-medium px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5" title="Auditoría de turnos cerrados">
        <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Turnos
      </button>
      <button onclick="abrirModalAdmin()" class="bg-[#241a38] hover:bg-[#342452] text-purple-200 border border-purple-800/70 font-semibold px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5" title="Panel de Administración y Gerencia (Stock, Personal, Habitaciones)">
        <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Administración
      </button>
      <button id="btn-marcar-salida-top" onclick="iniciarCierreTurno()" class="bg-red-800 hover:bg-red-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Cerrar Turno
      </button>
    </div>
  </div>

</header>
